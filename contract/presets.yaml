# Mission presets (plan 4.4). Shared contract: changed only by team agreement.
# dose_mgy_day: mean daily ABSORBED dose (what the simulator publishes as `dose_mgy`).
# quality_factor: dose equivalent / absorbed dose, used by the core service to convert to mSv for
# limit checks. Values marked verify were entered from memory and must be checked before the pitch.
presets:
  station:
    one_way_delay_s: 0
    dose_mgy_day: 0.285        # RadLab DosTel1+2 mean, ISS, Jan-Mar 2022 (data/processed/radlab_dose_calibration.csv)
    quality_factor: 2.0        # commonly cited ISS average -- verify
  moon:
    one_way_delay_s: 1.3
    dose_mgy_day: 0.32         # Chang'e 4 LND, ~13.2 uGy/h in silicon (Zhang et al. 2020) -- verify
    quality_factor: 4.3        # 1369 uSv/day / ~317 uGy/day, same paper -- verify
  mars_transit:
    one_way_delay_s: 750       # roughly 3-22 min; midpoint, needs a citation
    dose_mgy_day: 0.48         # Curiosity RAD cruise (Zeitlin et al. 2013)
    quality_factor: 3.8        # 1.84 mSv/day / 0.48 mGy/day, same paper -- verify
  mars_surface:
    one_way_delay_s: 750
    dose_mgy_day: 0.21         # Curiosity RAD surface (Hassler et al. 2014)
    quality_factor: 3.05       # 0.64 mSv/day / 0.21 mGy/day, same paper -- verify
