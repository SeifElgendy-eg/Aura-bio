# Shared contract: the signals the model/generator use (plan section 4.1/4.2).
# Names include the unit. `sim_mean`/`sim_sd` drive the generator only.
# sim_sd = day-to-day natural variation; person_sd = spread of baselines between astronauts.
# resting_hr_bpm, sleep_duration_h, sleep_efficiency_pct: calibrated from PhysioNet BIDSleep
# (data/processed/bidsleep_calibration.csv; resting HR = nocturnal, lowest 30-min mean in sleep).
# cabin_co2_mmhg: calibrated from OSDR EDA ISS CO2 (data/processed/eda_co2_calibration.csv; person_sd
# = spread between missions/cabins). ar = day-to-day persistence (lag-1), measured; default 0.4 when absent.
# rmssd_ms sim_sd 17 (log: true -> simulated in log space, sd_ln = 17/55): lnRMSSD day-to-day CV ~8% (middle of 3-13%, Bellenger et al. 2022, Sensors).
# bp_systolic_mmhg sim_sd 9: home SBP within-person day-to-day SD (Ohasama study, Kikuya et al. 2008).
# dose_mgy: daily absorbed dose, calibrated from RadLab ISS DosTel (data/processed/radlab_dose_calibration.csv);
# person_sd = spread between the two detector locations (only 2 locations: rough); per-preset level in presets.yaml.
# All other sim_* values (and the HRV/BP means and person_sd) are still guesses awaiting review.
# `model: true` signals form the autoencoder input vector, IN THIS ORDER.
signals:
  - {name: resting_hr_bpm,         system: cardiovascular, group: vitals,    source: wokwi,     sim_mean: 60.1, sim_sd: 3.64, person_sd: 5.28, ar: 0.25,  model: true}
  - {name: rmssd_ms,               system: cardiovascular, group: vitals,    source: wokwi,     sim_mean: 55,   sim_sd: 17,   person_sd: 10,  log: true,  model: true}
  - {name: bp_systolic_mmhg,       system: cardiovascular, group: vitals,    source: generator, sim_mean: 118,  sim_sd: 9,    person_sd: 6,    model: true}
  - {name: sleep_duration_h,       system: neurocognitive, group: vitals,    source: generator, sim_mean: 6.25, sim_sd: 1.01, person_sd: 0.73, ar: -0.20,  model: true}
  - {name: sleep_efficiency_pct,   system: neurocognitive, group: vitals,    source: generator, sim_mean: 88.9, sim_sd: 5.76, person_sd: 4.71, ar: -0.27,  model: true}
  - {name: reaction_lapses_pct,    system: neurocognitive, group: vitals,    source: app,       sim_mean: 8,    sim_sd: 2.5,  person_sd: 2,    model: true}
  - {name: mood_score,             system: neurocognitive, group: vitals,    source: app,       sim_mean: 7.5,  sim_sd: 0.6,  person_sd: 0.5,  model: true}
  - {name: cabin_co2_mmhg,         system: environment,    group: cabin,     source: wokwi,     sim_mean: 2.21, sim_sd: 0.46, person_sd: 0.50, ar: 0.87,  model: true}
  - {name: exercise_completion_pct, system: bone_muscle,   group: vitals,    source: app,       sim_mean: 98,   sim_sd: 4.0,  person_sd: 2,    model: true}
  - {name: dose_mgy,               system: radiation,      group: radiation, source: generator, sim_mean: 0.285, sim_sd: 0.0158, person_sd: 0.0255, ar: -0.05, log: true, model: true}
