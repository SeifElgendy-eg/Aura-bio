# docker compose up --build   (plan 3.7). Train first so artifacts/ exists: uv run python -m model.train
services:
  broker:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - broker-data:/mosquitto/data
    restart: unless-stopped
  core:
    build: .
    command: uvicorn core.app:app --host 0.0.0.0 --port 8000
    environment: {AURA_MQTT_HOST: broker, AURA_DB: /data/core.db}
    ports: ["8000:8000"]
    volumes: [core-data:/data]
    depends_on: [broker]
    restart: unless-stopped
  model:
    build: .
    command: uvicorn model.service:app --host 0.0.0.0 --port 8001
    ports: ["8001:8001"]
    volumes: [./artifacts:/app/artifacts:ro]
    restart: unless-stopped
volumes:
  broker-data:
  core-data:
